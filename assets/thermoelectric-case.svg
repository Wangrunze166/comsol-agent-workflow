<text x="81" y="608" fill="#526977" font-size="14" font-weight="400" >Conceptual assembly · not to scale · no computed field shown</text>
<text x="665" y="176" fill="#087e8b" font-size="16" font-weight="700" >01  STEADY FLOW</text>
<text x="665" y="213" fill="#142d3e" font-size="21" font-weight="400" >Solve the airflow; hold the velocity field fixed.</text>
<line x1="665" y1="242" x2="1345" y2="242" stroke="#d1e0e6" stroke-width="1" />
<text x="665" y="284" fill="#3273ba" font-size="16" font-weight="700" >02  THERMAL SYSTEM + PI CONTROL</text>
<text x="665" y="321" fill="#142d3e" font-size="21" font-weight="400" >Heat transfer ↔ lumped thermoelectric module</text>
<text x="665" y="355" fill="#142d3e" font-size="21" font-weight="400" >Device temperature → PI controller → current</text>
<line x1="665" y1="386" x2="1345" y2="386" stroke="#d1e0e6" stroke-width="1" />
<text x="665" y="429" fill="#087e8b" font-size="16" font-weight="700" >03  TWO REVIEWABLE STUDIES</text>
<text x="665" y="466" fill="#142d3e" font-size="21" font-weight="400" >Stationary: 7 current points, 0.5–3.5 A</text>
<text x="665" y="502" fill="#142d3e" font-size="21" font-weight="400" >Transient: 31 output times, 0–60 min</text>
<text x="665" y="556" fill="#526977" font-size="17" font-weight="400" >Derivative gain is zero: this configuration is PI.</text>
<text x="665" y="584" fill="#526977" font-size="17" font-weight="400" >Frozen flow is not fully transient two-way coupling.</text></g></svg>
