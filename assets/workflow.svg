<text x="520" y="234" fill="#a85b10" font-size="14" font-weight="700" >ENGINEERING REVIEW</text>
<text x="520" y="274" fill="#142d3e" font-size="14" font-weight="400" >Assumptions confirmed</text>
<text x="520" y="301" fill="#142d3e" font-size="14" font-weight="400" >Human decision</text>
<line x1="711" y1="254" x2="725" y2="254" stroke="#087e8b" stroke-width="1.5" marker-end="url(#arrow)"/>
