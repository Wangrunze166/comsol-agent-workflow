<text x="970" y="274" fill="#142d3e" font-size="14" font-weight="400" >Compile, load, solve</text>
<text x="970" y="301" fill="#142d3e" font-size="14" font-weight="400" >Export a new MPH + CSV</text>
<line x1="1161" y1="254" x2="1175" y2="254" stroke="#087e8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1177" y="162" width="207" height="184" rx="5" fill="#f4f9fa" stroke="#cbdde3"/>
<text x="1195" y="198" fill="#087e8b" font-size="16" font-weight="650" >06</text>
<text x="1195" y="234" fill="#087e8b" font-size="14" font-weight="700" >VERIFY + REPORT</text>
