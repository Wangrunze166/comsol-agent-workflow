<text x="52" y="63" fill="#142d3e" font-size="32" font-weight="650" >Every run has a reviewable chain of evidence.</text>
<text x="52" y="101" fill="#526977" font-size="19" font-weight="400" >One shared Skill. A version-specific executor. Two explicit human decisions.</text>
