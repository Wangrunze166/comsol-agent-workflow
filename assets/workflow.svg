<text x="295" y="301" fill="#142d3e" font-size="14" font-weight="400" >Input/code fingerprints</text>
<line x1="486" y1="254" x2="500" y2="254" stroke="#087e8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="502" y="162" width="207" height="184" rx="5" fill="#fff8ef" stroke="#dfc29e"/>
