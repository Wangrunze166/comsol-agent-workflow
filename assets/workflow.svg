<text x="745" y="274" fill="#142d3e" font-size="14" font-weight="400" >Exact plan approved</text>
<text x="745" y="301" fill="#142d3e" font-size="14" font-weight="400" >Human decision</text>
<line x1="936" y1="254" x2="950" y2="254" stroke="#087e8b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="952" y="162" width="207" height="184" rx="5" fill="#f4f9fa" stroke="#cbdde3"/>
